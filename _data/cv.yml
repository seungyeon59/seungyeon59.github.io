    Publications:
      - title: "AdapDict: A Level- and Domain-Adaptive Educational Dictionary and Encyclopedia System"
        authors:
          - "Manhwi Han*"
          - "SeungYeon Back*"
          - "Dong-Kyu Chae"
        publisher: CSCW 2026 (Accepted)
        releaseDate: 2026-01-01
        url: ""
        summary: >
          Proposed a level- and domain-adaptive explanation framework for controllable explanation generation in LLMs.
          Designed a generator-verifier loop with structured outputs, reducing hallucination by 50%. Developed a
          user-adaptive prompting mechanism for multi-dimensional control of explanation difficulty. Conducted a
          user study (n=41) demonstrating improved clarity, usability, and domain-specific understanding over
          baseline tools. (Co-first author)

      - title: "An Empirical Study of the Clustering of Mountain Hiking GPS Trajectory Data"
        authors:
          - "SeungYeon Back*"
          - "Manhwi Han*"
          - "Dong-Kyu Chae"
          - "Seoncheol Park"
        publisher: Under Revision, IEEE Access
        releaseDate: 2026-01-01
        url: ""
        summary: >
          Proposed a novel trajectory similarity measure integrating spatial, temporal, and velocity components for
          irregular spatio-temporal data. Designed an epsilon-ball-based spatial similarity metric and a
          data-adaptive weighting framework (alpha, beta, gamma) for flexible similarity modeling. Applied
          hierarchical clustering to large-scale GPS trajectory data to uncover latent behavioral patterns.
          (Co-first author)

